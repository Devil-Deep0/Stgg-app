name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: |
          TARGET_DIR="."
          if [ ! -f "settings.gradle.kts" ] && [ -d "STGG-ESPORTS-APP" ]; then
            TARGET_DIR="STGG-ESPORTS-APP"
          fi
          cd "$TARGET_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STGG-ESPORTS-APK
          path: "**/build/outputs/apk/debug/*.apk"
